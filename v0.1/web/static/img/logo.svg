<!--
AddrLens — Pin+Scope logo v3 (Berlin flag palette).

Design reference: geometric pin silhouette with a crosshair/scope
inside its bulb — horizontal + vertical guide lines cut ACROSS the
pin and break where they cross the inner scope ring, so the mark
reads as "pin with a targeting reticle inside" rather than a solid
dot. Matches the negative-space discipline of the addrLens reference
mock the user provided.

Berlin flag palette:
  red   #DA291C   (Berlin coat-of-arms red — the primary silhouette)
  black #0D0D0D   (strokes / negative-space cuts)
  white #FFFFFF   (the pin's inner cavity — scope face)

No gradients — flat colour blocks so the mark stays crisp at favicon
sizes and prints well in single-colour reductions.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
     width="512" height="512" role="img"
     aria-label="AddrLens — pin with targeting scope">

  <!-- ==================================================================
       Pin silhouette — filled red teardrop. Bulb centre (256, 200),
       tip at cy=440. Same overall proportions as the reference mock:
       broad round bulb, tapered tip.
       ================================================================== -->
  <path d="M 256 440
           C 208 356, 152 300, 152 200
           a 104 104 0 1 1 208 0
           C 360 300, 304 356, 256 440 Z"
        fill="#DA291C"/>

  <!-- ==================================================================
       Scope ring — white circle inside the bulb. This is the "lens" /
       "target" face. Kept thick and geometric so it reads at 32 px.
       ================================================================== -->
  <circle cx="256" cy="200" r="66" fill="#FFFFFF"/>

  <!-- Inner scope dot — the "sighted target". Small solid red circle
       at the centre so the mark keeps a Berlin-red accent inside the
       otherwise white scope face. -->
  <circle cx="256" cy="200" r="18" fill="#DA291C"/>

  <!-- ==================================================================
       Crosshair guide lines — full horizontal + vertical bars that
       cross the pin, BROKEN where they intersect the scope ring
       (achieved by drawing the bars only in the outer bands, not
       across the scope circle itself).

       Horizontal line: two short black bars at y=200 sitting outside
       the scope's left and right edges.
       Vertical line: same idea, outside top and bottom of the scope.

       The result is a targeting reticle that visually implies
       infinite cross-lines while keeping the scope face clean.
       ================================================================== -->
  <g stroke="#0D0D0D" stroke-width="14" stroke-linecap="butt">
    <!-- Horizontal cross-bars, breaking at the scope ring -->
    <line x1="152" y1="200" x2="176" y2="200"/>   <!-- left of scope, ends at pin edge -->
    <line x1="336" y1="200" x2="360" y2="200"/>   <!-- right of scope, ends at pin edge -->
    <!-- Vertical cross-bars, breaking at the scope ring -->
    <line x1="256" y1="96"  x2="256" y2="120"/>   <!-- top -->
    <line x1="256" y1="280" x2="256" y2="308"/>   <!-- bottom, just past bulb before taper -->
  </g>

  <!-- ==================================================================
       Scope ring outline — thin black ring around the white face so
       the reticle geometry stays crisp against the red pin body.
       ================================================================== -->
  <circle cx="256" cy="200" r="66"
          fill="none" stroke="#0D0D0D" stroke-width="10"/>

  <!-- Pin outline — thin black stroke around the full teardrop so the
       silhouette pops on any background. -->
  <path d="M 256 440
           C 208 356, 152 300, 152 200
           a 104 104 0 1 1 208 0
           C 360 300, 304 356, 256 440 Z"
        fill="none" stroke="#0D0D0D" stroke-width="10"
        stroke-linejoin="round"/>
</svg>
