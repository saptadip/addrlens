<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140" role="img" aria-label="Berlin bear watermark">
  <!-- Stylised standing bear silhouette — a nod to the Berliner Bär that
       has been Berlin's civic mark since 1280, drawn intentionally as a
       generic decorative bear (no shield, no crown) so it stays clear of
       the official heraldic mark and reads as an archival flourish, not
       an official emblem. Rendered at ~7% opacity by the .addr-history-body
       CSS so it sits behind the History text without competing. -->
  <g fill="#5A3F14" fill-opacity="0.08">
    <!-- Head -->
    <ellipse cx="60" cy="30" rx="18" ry="17"/>
    <!-- Ears -->
    <ellipse cx="43" cy="15" rx="7" ry="8"/>
    <ellipse cx="77" cy="15" rx="7" ry="8"/>
    <!-- Muzzle -->
    <ellipse cx="60" cy="38" rx="8" ry="5"/>
    <!-- Torso -->
    <path d="M 40 46 Q 30 56 30 74 L 30 102 Q 30 116 42 118 L 78 118 Q 90 116 90 102 L 90 74 Q 90 56 80 46 Q 74 44 60 44 Q 46 44 40 46 Z"/>
    <!-- Front arms raised outward -->
    <path d="M 32 60 Q 18 58 12 70 Q 10 79 18 82 Q 26 83 32 76 Z"/>
    <path d="M 88 60 Q 102 58 108 70 Q 110 79 102 82 Q 94 83 88 76 Z"/>
    <!-- Rear legs / feet -->
    <ellipse cx="43" cy="126" rx="10" ry="6"/>
    <ellipse cx="77" cy="126" rx="10" ry="6"/>
  </g>
</svg>
