<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
  <!-- Parchment grain — fractal noise coloured to brown-cream, ~7% alpha.
       Tiled across the .addr-history-body card to give an archival paper feel
       without hiding the existing beige gradient underneath. -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.42
                           0 0 0 0 0.30
                           0 0 0 0 0.12
                           0 0 0 0.08 0"/>
  </filter>
  <rect width="240" height="240" filter="url(#grain)"/>
</svg>
