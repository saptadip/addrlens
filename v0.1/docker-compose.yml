# Dev: one app + one inference on the same host. See plan §7.4.
#
# Caveat: MLX inside Docker on macOS does NOT use the Apple GPU
# (Docker on Mac runs Linux). For fastest dev, run
#   `uvicorn inference.main:app --port 8080`
# directly on the host (Apple Silicon → mlx-lm) and point the app at
# host.docker.internal:8080.
services:
  app:
    build:
      context: .
      dockerfile: ops/Dockerfile.app
    environment:
      CITY: berlin
      PORT: 8001
      INFERENCE_URL: http://inference:8080
    ports:
      - "8001:8001"
    depends_on:
      - inference
  inference:
    build:
      context: .
      dockerfile: ops/Dockerfile.inference
    environment:
      INFERENCE_BACKEND: llama
      PORT: 8080
    ports:
      - "8080:8080"
