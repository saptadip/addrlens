<!--
AddrLens — Pin-Lens Fusion logo (concept sketch v1).

The mark: a map pin whose bulb IS a lens. Inside the lens sits a
gradient dot (indigo → pink, mirroring the app's fit-score hero).
Four satellite ticks (S-Bahn / Kita / tree / bus) hint at the multi-
signal analysis without adding noise at favicon scale.

Colours pinned to app.css brand tokens:
  indigo   #4F46E5   (primary)
  violet   #6D28D9   (accent)
  pink     #DB2777   (gradient end)
  slate    #1E293B   (ink)

Sizes: this file is a 512x512 master. Downscale for favicon (32/64)
and header (48/80). Drop the satellite ticks at ≤ 32 px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
     width="512" height="512" role="img"
     aria-label="AddrLens — pin fused with a lens">
  <defs>
    <!-- Central gradient dot: matches .metric-big .n / .lens-ai-fit-n. -->
    <linearGradient id="al-brand-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#4F46E5"/>
      <stop offset="55%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>

    <!-- Skeuomorphic depth on the pin body — matches .lens-ai-score-card. -->
    <linearGradient id="al-pin-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Inner shadow on the lens ring to seat the gradient dot. -->
    <radialGradient id="al-lens-inner" cx="50%" cy="42%" r="55%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft drop shadow to lift the whole mark. -->
    <filter id="al-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10"
                    flood-color="#4F46E5" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- ============================================================
       Pin silhouette: teardrop from bulb down to point.
       Path is a classic map-pin: circle bulb (r=112, cy=196) fused
       with two symmetric tangent lines meeting at the tip (cy=428).
       ============================================================ -->
  <g filter="url(#al-shadow)">
    <path d="M 256 428
             C 200 340, 144 288, 144 196
             a 112 112 0 1 1 224 0
             C 368 288, 312 340, 256 428 Z"
          fill="url(#al-pin-body)"
          stroke="#312E81" stroke-width="6"
          stroke-linejoin="round"/>

    <!-- Lens ring — hollow circle inset into the pin's bulb. -->
    <circle cx="256" cy="196" r="76"
            fill="#FFFFFF"
            stroke="#312E81" stroke-width="6"/>
    <!-- Inner-highlight overlay for depth. -->
    <circle cx="256" cy="196" r="76"
            fill="url(#al-lens-inner)"/>

    <!-- Central gradient dot — the "focused signal" the lens is
         looking at. Sized so it reads as a chip, not a filler. -->
    <circle cx="256" cy="196" r="44"
            fill="url(#al-brand-fill)"/>

    <!-- Micro-glint on the dot (skeuomorphic clay-dial touch). -->
    <ellipse cx="240" cy="180" rx="14" ry="8"
             fill="#FFFFFF" fill-opacity="0.35"/>
  </g>

  <!-- ============================================================
       Satellite ticks — 4 tiny markers around the lens ring at
       N / E / S / W. Each one hints at one of the app's tile
       families without being literal. Drop these when scaled
       below ~64 px (add media query in HTML use).

       - top   (N)  = transit         (small hex)
       - right (E)  = amenities       (square)
       - bottom(S)  = green refuge    (triangle)
       - left  (W)  = quiet living    (dot with ring)
       ============================================================ -->
  <g fill="#312E81" opacity="0.9">
    <!-- N: transit hex -->
    <polygon points="256,88 268,95 268,109 256,116 244,109 244,95"/>
    <!-- E: amenities square -->
    <rect x="342" y="188" width="16" height="16" rx="2"/>
    <!-- S: refuge triangle (leaf-ish) -->
    <polygon points="256,296 246,314 266,314"/>
    <!-- W: quiet-living outlined dot -->
    <circle cx="162" cy="196" r="7" fill="none" stroke="#312E81" stroke-width="3"/>
    <circle cx="162" cy="196" r="3"/>
  </g>
</svg>
