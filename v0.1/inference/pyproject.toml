[project]
name = "addrlens-inference"
version = "0.1.0"
description = "Shared LLM inference service (FastAPI). One image, all cities."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # httpx is used by inference/runtime/cloudflare_backend.py to hit the
    # Workers AI OpenAI-compat endpoint. Sync API only; no additional deps.
    "httpx>=0.27",
]

# Backends are optional so the dev machine (Apple Silicon) installs mlx-lm
# and the prod image (Linux) installs llama-cpp-python. Never both.
[project.optional-dependencies]
dev = ["mlx-lm>=0.19"]
prod = ["llama-cpp-python>=0.3"]

[tool.uv]
package = false

# We ship this as a service, not a library — don't try to auto-discover
# packages from the multi-package flat layout (runtime/, templates/).
[tool.setuptools]
py-modules = []
