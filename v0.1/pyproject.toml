[project]
name = "addrlens-app"
version = "0.1.0"
description = "Per-city address-intelligence app service (FastAPI). Talks to shared inference-service over HTTP."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "shapely>=2.0",
    "prometheus-client>=0.21",
    "slowapi>=0.1.9",
    "cachetools>=5.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: hits live Berlin Geoportal WFS (opt-in via -m integration)",
]

[tool.coverage.run]
source = ["app"]
branch = false

[tool.coverage.report]
# Exclude the `if __name__ == "__main__":` selfcheck blocks — those are
# invoked by `python -m app.selfcheck` in a subprocess, not by pytest.
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pragma: no cover",
]
