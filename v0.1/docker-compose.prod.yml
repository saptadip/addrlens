# Prod overlay. Load with:
#   docker compose \
#       -f docker-compose.yml \
#       -f docker-compose.prod.yml \
#       --env-file /srv/addrlens/.env.production \
#       up -d
#
# What it changes vs docker-compose.yml:
# 1. Cancels "ports:" publishing (containers stay on internal bridge).
# 2. Adds cloudflared as the only ingress path.
# 3. Bind-mounts /srv/addrlens/{models,data/osm} as read-only.
# 4. Adds mem_limit + memswap_limit so a runaway service OOM-kills itself,
#    not the box.
# 5. restart: unless-stopped for docker-managed liveness.
# 6. Reads secrets from /srv/addrlens/.env.production (git-ignored).

services:
  app:
    ports: !reset []
    env_file:
      - /srv/addrlens/.env.production
    volumes:
      # Read-write so the one-shot OSM refresh container can rewrite the
      # snapshot atomically. The running app only reads from this path;
      # write access here is exercised only by the refresh container
      # (weekly systemd timer, or ad-hoc after a bucket-schema change).
      #
      # Correct invocation — must override the entrypoint because the
      # Dockerfile has no ENTRYPOINT, only `CMD ["uvicorn", ...]`; a
      # bare `-m ...` arg would replace CMD and fail with "exec: -m:
      # executable file not found":
      #
      #   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
      #     run --rm --entrypoint python app \
      #     -m scripts.refresh_osm_amenities
      #
      # Restart the app afterwards so the OsmLocalCache reloads at boot.
      - /srv/addrlens/data/osm:/srv/data/osm
    mem_limit: 700m
    memswap_limit: 1200m
    restart: unless-stopped
    depends_on:
      inference:
        condition: service_healthy
    networks:
      - addrlens_net

  inference:
    ports: !reset []
    env_file:
      - /srv/addrlens/.env.production
    # Explicit build target — prod runs the `remote` stage (Cloudflare
    # Workers AI only). Belt-and-suspenders alongside the Dockerfile's
    # stage order: if a future edit reorders stages, this line pins
    # prod to the correct target.
    build:
      context: .
      dockerfile: ops/Dockerfile.inference
      target: remote
    # No models bind-mount — prod is remote-only. Re-add the mount +
    # LLAMA_MODEL_PATH env only if you switch to `target: local`.
    # mem_limit sized for FastAPI + httpx + sentry-sdk footprint
    # (typically ~150-200 MB RSS). memswap_limit unlimited (-1) so a
    # transient httpx buffer spike or Sentry event batch doesn't OOM.
    mem_limit: 512m
    memswap_limit: -1
    restart: unless-stopped
    networks:
      - addrlens_net

  # --- Hamburg app container (parallel to the Berlin `app` service) -----
  # Same image + inference container as Berlin. CITY=hamburg picks up the
  # HAMBURG CityConfig, city-scoped OSM snapshot dir, and Hamburg-specific
  # constants at boot. Cloudflare Tunnel routes hamburg.addrlens.de →
  # app-hh:8002 (see ops/cloudflared/README.md). Runs on port 8002 so
  # `docker logs app-hh` and any host-network debug can be visually
  # distinguished from Berlin's :8001.
  app-hh:
    build:
      context: .
      dockerfile: ops/Dockerfile.app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002"]
    env_file:
      - /srv/addrlens/.env.production
    environment:
      CITY: hamburg
      PORT: 8002
      INFERENCE_URL: http://inference:8080
      HVV_STATIONS_PATH: /srv/hamburg-transit/vbb_hamburg_su.csv
      HVV_FERRY_PATH: /srv/hamburg-transit/hvv_hamburg_ferry.csv
      HVV_OUT_SU: /srv/hamburg-transit/vbb_hamburg_su.csv
      HVV_OUT_FERRY: /srv/hamburg-transit/hvv_hamburg_ferry.csv
    volumes:
      - /srv/addrlens/data/osm-hamburg:/srv/data/osm
      - /srv/addrlens/data/hamburg-transit:/srv/hamburg-transit
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    mem_limit: 700m
    memswap_limit: 1200m
    restart: unless-stopped
    depends_on:
      inference:
        condition: service_healthy
    networks:
      - addrlens_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    env_file:
      - /srv/addrlens/.env.production
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      app-hh:
        condition: service_healthy
    networks:
      - addrlens_net

  # --- Umami analytics (cookieless, self-hosted, GDPR-clean) --------------
  # Reachable via a second CF Tunnel Public Hostname (umami.addrlens.de →
  # http://umami:3000). The umami-db volume is bind-mounted so Postgres
  # data survives container recreates. On first boot the operator logs in
  # with the default admin/umami credentials, immediately rotates the
  # password, registers addrlens.de as a website, and copies the tracking
  # ID into UMAMI_WEBSITE_ID / UMAMI_SCRIPT_URL in .env.production. Until
  # those two env vars are set the app does not inject the tracker snippet.
  umami-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - /srv/addrlens/umami-db:/var/lib/postgresql/data
    mem_limit: 200m
    memswap_limit: 400m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - addrlens_net

  umami:
    # Pinned to a specific tag (not postgresql-latest) so an unattended
    # `docker compose pull` never silently upgrades across a breaking change.
    # 2FA data is encrypted with TWO_FACTOR_ENCRYPTION_KEY below — a mid-week
    # schema or crypto-scheme change on a floating tag would be a bad day.
    # Verify + bump this tag deliberately (compare digests: `docker manifest
    # inspect ghcr.io/umami-software/umami:<new-tag>`).
    image: ghcr.io/umami-software/umami:3.3.1
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
      # 64-char hex key (openssl rand -hex 32) that encrypts each user's TOTP
      # secret + backup codes at rest. Losing OR rotating it invalidates every
      # stored 2FA secret — store off-server (password manager + printed sealed
      # copy) BEFORE any admin enrols. See docs/hetzner-deploy.md → "Two-Factor
      # Auth". Also: every `docker compose` invocation touching this service
      # MUST include `--env-file /srv/addrlens/.env.production` (this service
      # uses compose-time ${...} interpolation, not env_file).
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_TWO_FACTOR_ENCRYPTION_KEY}
    mem_limit: 350m
    memswap_limit: 600m
    restart: unless-stopped
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - addrlens_net

networks:
  addrlens_net:
    driver: bridge
    internal: false
