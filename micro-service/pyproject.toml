[project]
name = "addrlens-app"
version = "0.1.0"
description = "Per-city address-intelligence app service (FastAPI). Talks to shared inference-service over HTTP."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "shapely>=2.0",
    "prometheus-client>=0.21",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.setuptools]
py-modules = []
